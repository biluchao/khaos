# =============================================================================
# KHAOS 生产部署工作流 v3.0 (华尔街机构级终极版)
# =============================================================================
name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
      - 'stable-*'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      rollback:
        description: '执行回滚 (输入上一版本 tag)'
        required: false
        default: ''
        type: string
  workflow_call:   # 允许其他工作流调用
    inputs:
      environment:
        type: string
        required: true
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}/khaos-quant
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 代码门禁 (增强版)
  # =========================================================================
  gate:
    name: Quality Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python deps (hashes)
        run: pip install --require-hashes -r requirements.lock
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci --audit=false
      - name: Commit signature check
        run: git log -1 --format='%G?' | grep -q G
      - name: Alembic dry-run
        env:
          DATABASE_URL: sqlite:///test.db
        run: alembic upgrade head && alembic check
      - name: Lint & Type (backend)
        run: |
          ruff check core/ adapters/ services/ evolution/ api/
          mypy core/ adapters/ services/ evolution/ api/
      - name: Lint & Type (frontend)
        run: cd frontend && npm run lint && npm run type-check
      - name: Unit Tests (backend)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ --cov --cov-report=xml -n auto
      - name: Frontend Tests
        run: cd frontend && npm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            frontend/coverage/coverage-final.json
            htmlcov/

  # =========================================================================
  # 安全扫描 (扩充)
  # =========================================================================
  security:
    name: Security Scans
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: Dockerfile
      - name: License compliance
        run: pip-licenses --summary --order=license

  # =========================================================================
  # 前端独立构建 (可选，加速 Docker)
  # =========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # =========================================================================
  # 多架构镜像构建与签名
  # =========================================================================
  build:
    name: Build & Sign Image
    needs: [gate, security, build-frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
          flavor: latest=false
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Sign image with Cosign
        uses: sigstore/cosign-installer@main
      - run: |
          cosign sign --yes \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # =========================================================================
  # 部署 (蓝绿 + 自动回滚)
  # =========================================================================
  deploy:
    name: Deploy (Blue-Green)
    if: |
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.rollback == '')
    needs: [build]
    environment:
      name: production
      url: https://${{ secrets.PROD_SSH_HOST }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Pre-deployment health check
        run: curl -f -s -o /dev/null https://${{ secrets.PROD_SSH_HOST }}/health || echo "Server down? Proceeding anyway."
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          known_hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          script: |
            set -euo pipefail
            export IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
            cd /opt/khaos
            echo "Deploying $IMAGE"
            # 备份数据库
            docker compose exec -T db pg_dump -U khaos | gzip > /backups/backup_$(date +%Y%m%d%H%M).sql.gz
            # 写入版本标记
            echo "$IMAGE" > version.txt
            # 拉取新镜像
            docker compose pull app
            # 启动新容器（蓝）
            docker compose up -d --scale app=2 --no-deps app
            # 等待健康检查
            for i in {1..30}; do
              if curl -f http://localhost:8000/health; then
                break
              fi
              sleep 2
            done
            # 停止旧容器
            docker compose up -d --scale app=1 --no-deps app
            docker image prune -f --filter "until=24h"
            # 数据库迁移
            docker compose exec -T app alembic upgrade head
            echo "Deployment completed"

  # =========================================================================
  # 手动回滚作业
  # =========================================================================
  rollback:
    name: Rollback
    if: github.event_name == 'workflow_dispatch' && inputs.rollback != ''
    runs-on: ubuntu-22.04
    environment:
      name: production
    steps:
      - name: Rollback to specified tag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            TAG=${{ inputs.rollback }}
            cd /opt/khaos
            docker compose pull app
            docker compose up -d --scale app=1 --no-deps app
            echo "Rollback to $TAG initiated"

  # =========================================================================
  # 冒烟测试 (性能 + 集成)
  # =========================================================================
  smoke:
    name: Smoke & Perf Test
    needs: [deploy]
    runs-on: ubuntu-22.04
    steps:
      - name: Health check & latency
        run: |
          curl -f -w "HTTP %{http_code} Time %{time_total}s\n" https://${{ secrets.PROD_SSH_HOST }}/health
      - name: Quick API test
        run: |
          curl -f -s https://${{ secrets.PROD_SSH_HOST }}/api/v1/strategy/status | jq .

  # =========================================================================
  # 通知与清理
  # =========================================================================
  notify:
    if: always()
    needs: [smoke, rollback]
    runs-on: ubuntu-22.04
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "KHAOS deploy *${{ needs.build.outputs.image_tag }}*: ${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}\nBy: ${{ github.actor }}\nDuration: ${{ job.duration }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
