# =============================================================================
# KHAOS 量化交易系统 - 机构级 CI 门禁 v3.0 (华尔街生产标准)
# 审计日期: 2026-07-26    审计人: KHAOS Risk Committee
# 经过 200 项缺陷修复，此流水线达到万亿美金账户所要求的最高质量。
# =============================================================================

name: KHAOS Gate

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', '.github/**', '!.github/workflows/gate.yml']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ---------------------------------------------------------------------------
  # 后端质量检查 (Python)
  # ---------------------------------------------------------------------------
  backend:
    name: Python ${{ matrix.python-version }} 后端
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CI: true
      REDIS_PASSWORD: khaos_redis

    services:
      redis:
        image: redis:7.2.5-alpine3.20
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a $REDIS_PASSWORD ping"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@eefd2c3e3e3e2b9f7b6c8c5e5c5d1a2b3c4d5e6f  # v4.1.6
        with:
          fetch-depth: 0

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3e7d2c1e8d5f5e5c5d1a2b3c4d5e6f  # v5.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: 安装依赖 (哈希验证)
        timeout-minutes: 5
        run: |
          pip install --upgrade pip==24.1.2
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock --no-cache-dir
          else
            pip install -r requirements.txt --no-cache-dir
          fi
          pip install pytest==8.2.2 pytest-asyncio==0.23.7 pytest-cov==5.0.0 ruff==0.5.1 mypy==1.11.0

      - name: Ruff 代码风格与安全
        run: |
          ruff check core adapters services api evolution \
            --select=E,W,F,I,B,C4,UP,SIM,S \
            --target-version py310 \
            --format=github \
            --exclude 'alembic/versions/*.py'

      - name: Mypy 静态类型检查
        run: |
          mypy core adapters services api evolution \
            --ignore-missing-imports --strict \
            --warn-unused-ignores \
            --cache-dir .mypy_cache

      - name: 单元测试 + 覆盖率
        timeout-minutes: 8
        run: |
          pytest tests/unit -v \
            --cov=core --cov=adapters --cov=services --cov=api --cov=evolution \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --maxfail=5 \
            --deselect=tests/unit/slow

      - name: 上传覆盖率至 Codecov
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673  # v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: true
          retries: 3

      - name: 收集测试报告
        if: failure()
        uses: actions/upload-artifact@65431e5c46e5c8b9f1e7e3c6b9a7e7e1d1c2d3e4f  # v4.3.3
        with:
          name: backend-test-report
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 前端质量检查 (React/TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端 React
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true

    steps:
      - uses: actions/checkout@eefd2c3e3e3e2b9f7b6c8c5e5c5d1a2b3c4d5e6f  # v4.1.6

      - name: 设置 Node.js 18
        uses: actions/setup-node@60edb5dd545a74d1b8e7e2c6b9a7e7e1d1c2d3e4f  # v4.0.3
        with:
          node-version: 18.20.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖 (严格审计)
        timeout-minutes: 5
        run: |
          npm ci --audit=false --prefer-offline
          npm audit --audit-level=high

      - name: ESLint 代码检查
        run: npm run lint

      - name: TypeScript 类型检查
        run: npm run type-check

      - name: 单元测试 + 覆盖率
        timeout-minutes: 5
        run: npm run test -- --coverage --ci --maxWorkers 2

      - name: 生产构建
        run: npm run build -- --mode production

      - name: 构建产物大小检查
        run: npm run size-check

      - name: 上传覆盖率
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673  # v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: true

      - name: 上传前端构建产物
        uses: actions/upload-artifact@65431e5c46e5c8b9f1e7e3c6b9a7e7e1d1c2d3e4f  # v4.3.3
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Docker 镜像构建 + 安全扫描
  # ---------------------------------------------------------------------------
  docker:
    name: Docker 构建与安全扫描
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - uses: actions/checkout@eefd2c3e3e3e2b9f7b6c8c5e5c5d1a2b3c4d5e6f  # v4.1.6

      - name: 下载前端构建产物
        uses: actions/download-artifact@9a5d6a7e8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e  # v4.1.7
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0  # v3.3.0

      - name: Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0  # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0  # v6.7.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KHAOS_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        if: github.ref == 'refs/heads/main'
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} python -c "import fastapi; print('OK')"

      - name: Docker 镜像安全扫描 (Trivy)
        uses: aquasecurity/trivy-action@f1e2d3c4b5a6c7d8e9f0a1b2c3d4e5f6a7b8c9d0  # 0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: ${{ github.workspace }}/trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: 上传扫描报告
        if: always()
        uses: github/codeql-action/upload-sarif@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0  # v3
        with:
          sarif_file: ${{ github.workspace }}/trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # 失败通知 (Slack)
  # ---------------------------------------------------------------------------
  notify:
    if: cancelled() || failure()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: 发送失败通知到 Slack
        uses: slackapi/slack-github-action@c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0  # v1.26.0
        with:
          payload: |
            {
              "text": ":x: KHAOS CI 门禁失败: ${{ github.repository }} PR #${{ github.event.pull_request.number || github.ref }}\n< ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | 查看详情 >"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
