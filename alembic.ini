# =============================================================================
# KHAOS 数据库迁移配置 (Alembic)
# 华尔街机构级标准 - 支持 SQLite / PostgreSQL
# =============================================================================

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库连接 (从环境变量读取，避免硬编码)
# 生产环境: KHAOS_DATABASE_URL=postgresql://user:pass@host:5432/khaos
# 开发环境: KHAOS_DATABASE_URL=sqlite:///data/khaos.db
sqlalchemy.url = %(KHAOS_DATABASE_URL)s

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
