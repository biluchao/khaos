# =============================================================================
# KHAOS 数据库迁移配置 (Alembic) - 华尔街机构级终版
# 支持 SQLite / PostgreSQL，适用于 100 美金至万亿美金账户。
# =============================================================================

[DEFAULT]
# 默认环境变量，用于构建完整的数据库 URL。
KHAOS_DB_USER = khaos
KHAOS_DB_PASS = %(KHAOS_DB_PASSWORD)s
KHAOS_DB_HOST = localhost
KHAOS_DB_PORT = 5432
KHAOS_DB_NAME = khaos

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库连接 (强烈建议通过环境变量注入)
# 示例: KHAOS_DATABASE_URL=postgresql://user:pass@host:5432/khaos
#       KHAOS_DATABASE_URL=sqlite:///data/khaos.db
sqlalchemy.url = %(KHAOS_DATABASE_URL)s

# 为无法提供环境变量的场景提供硬性保护（会被注释，仅作示例）
# fallback_url = sqlite:///data/khaos.db

# 日志中隐藏数据库参数，防止密码泄露
hide_parameters = True

# 迁移版本表名，避免与默认表名冲突
version_table = alembic_version_khaos

# 迁移脚本排序方式
migration_sorting = alphabetical

# 自动生成迁移时，对比列类型、服务器默认值和身份列
compare_type = True
compare_server_default = True
compare_identity = True

# 迁移文件行宽截断
truncation_length = 80

# 迁移文件前缀
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# 每次迁移在一个事务中执行（PostgreSQL / SQLite 支持）
transaction_per_migration = True

# 添加项目根目录到 sys.path，以便导入核心模型
prepend_sys_path = .

# 运行迁移时使用的标识名
run_name = khaos_migration

# ---------- 数据库引擎通用选项 ----------
[sqlalchemy.engine_options]
# 连接池大小（适用于 PostgreSQL，SQLite 忽略）
pool_size = 5
max_overflow = 10
pool_recycle = 3600
pool_pre_ping = True
# 启用 SQLAlchemy 2.0 风格（需项目支持）
future = True
# 连接参数：对于 PostgreSQL 可设置 application_name
connect_args =
    application_name=khaos_migration
# 对于 SQLite，启用 WAL 模式和禁用外键检查（在 env.py 中实现）
# 但此处可统一声明

# ---------- 日志配置 ----------
[loggers]
keys = root,sqlalchemy,alembic,audit

[handlers]
keys = console,file,syslog

[formatters]
keys = generic,detailed

[logger_root]
level = WARN
handlers = console,file,syslog
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_audit]
level = INFO
handlers = file,syslog
qualname = alembic.audit

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = logging.handlers.TimedRotatingFileHandler
args = ('/var/log/khaos/alembic.log', 'midnight', 1, 30)
level = NOTSET
formatter = detailed

[handler_syslog]
class = logging.handlers.SysLogHandler
args = (('localhost', 514),)
level = WARNING
formatter = generic

[formatter_generic]
format = %(asctime)s.%(msecs)03d [%(levelname)-5s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_detailed]
format = %(asctime)s.%(msecs)03d [%(levelname)-5s] %(name)s (PID:%(process)d) %(funcName)s:%(lineno)d - %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# ---------- Post-write 钩子：自动格式化迁移文件 ----------
[post_write_hooks]
hooks = black, isort
black.type = console_scripts
black.entrypoint = black
black.options = -l 100
isort.type = console_scripts
isort.entrypoint = isort
isort.options = --profile black

# ---------- 环境特定配置 ----------
# SQLite 特殊配置：在 env.py 中应使用 render_as_batch=True
# 如需在此声明，可通过自定义键，但 alembic 不直接支持，此处提供注释指引。
# 对于 PostgreSQL，建议使用以下连接参数以获得最佳性能：
# connect_args = { "sslmode": "require", "connect_timeout": 10, "keepalives_idle": 30 }
