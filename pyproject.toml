[build-system]
requires = ["setuptools>=68.0,<70", "wheel>=0.41,<1", "setuptools-scm>=7.1,<8"]
build-backend = "setuptools.build_meta"

[project]
name = "khaos-quant"
dynamic = ["version"]   # 由 setuptools-scm 管理
description = "KHAOS – 机构级量化交易系统，支持多周期共振、自适应风控与进化算法"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }
authors = [
    { name = "KHAOS Engineering", email = "engineering@khaos.example.com" }
]
keywords = ["quantitative", "trading", "crypto", "algo-trading", "risk-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

# 显式声明核心依赖（从 requirements.txt 移植，精确锁定）
dependencies = [
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "pydantic>=2.5,<3",
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "websockets>=12.0,<13",
    "ccxt>=4.1,<5",
    "aiohttp>=3.9,<4",
    "redis>=5.0,<6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "hmmlearn>=0.3,<1",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-asyncio>=0.21,<1",
    "pytest-cov>=4.1,<5",
    "pytest-benchmark>=4.0,<5",
    "pytest-mock>=3.12,<4",
    "black>=23.11,<24",
    "ruff>=0.1,<1",
    "mypy>=1.7,<2",
    "pre-commit>=3.5,<4",
    "types-requests>=2.31,<3",
    "types-PyYAML>=6.0,<7",
    "types-redis>=4.6,<5",
]
evolution = [
    "optuna>=3.4,<4",
    "stable-baselines3>=2.1,<2.3",
    "torch>=2.1,<2.3",
    "hmmlearn>=0.3,<1",
]
docs = [
    "sphinx>=7.2,<9",
    "sphinx-rtd-theme>=2.0,<3",
    "myst-parser>=2.0,<3",
]

[project.urls]
Homepage = "https://khaos.example.com"
Documentation = "https://docs.khaos.example.com"
Repository = "https://github.com/khaos/khaos"
Issues = "https://github.com/khaos/khaos/issues"

[project.scripts]
khaos = "core.engine.strategy_engine:main"   # 假设主入口

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "services*", "evolution*", "api*"]
exclude = ["tests*", "docs*", "scripts*", "deploy*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.sql", "*.ini", "*.txt", "*.md"]
"alembic" = ["versions/*.py", "*.mako"]

[tool.setuptools_scm]
write_to = "core/_version.py"

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-v --strict-markers --tb=short --cov=core --cov=adapters --cov=services --cov=evolution --cov=api --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["core", "adapters", "services", "evolution", "api"]
omit = ["*/tests/*", "*/migrations/*", "*/venv/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", ".git", "__pycache__", "build", "dist"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]
ignore = ["E501", "S101"]  # line too long, assert used

[tool.ruff.isort]
known-first-party = ["core", "adapters", "services", "evolution", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.egg-info
)/
'''
